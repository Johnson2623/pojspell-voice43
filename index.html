<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI 跨界音樂元素工作站 v28 | Gemini 3.1 Pro 深度解析 × 四大曲風重混</title>
  <style>
    :root {
      --bg-main: #111111;
      --bg-panel: #181818;
      --bg-card: #1f1f1f;
      --bg-pill: #252525;
      --bg-pill-hover: #303030;
      --border-subtle: #2e2e2e;
      --border-active: #ff6d33;
      --accent: #ff6d33;
      --accent-hover: #ff814d;
      --accent-glow: rgba(255, 109, 51, 0.16);
      --text-primary: #f3f3f3;
      --text-secondary: #a0a0a0;
      --text-muted: #707070;
      --radius-lg: 14px;
      --radius-md: 10px;
      --radius-pill: 999px;
      --font-sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      font-family: var(--font-sans);
      line-height: 1.55;
      min-height: 100vh;
      padding: 18px 22px 40px;
    }

    .app-container {
      max-width: 1360px;
      margin: 0 auto;
    }

    /* Top Header Utility Bar */
    .utility-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .brand-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: var(--text-secondary);
    }
    .brand-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }
    .utility-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* 4 Mode Tabs */
    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .mode-tab {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 14px 12px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }
    .mode-tab:hover {
      background: var(--bg-pill-hover);
      color: var(--text-primary);
    }
    .mode-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      box-shadow: 0 4px 18px rgba(255, 109, 51, 0.35);
    }

    /* Progress Bar */
    .progress-track {
      width: 100%;
      height: 6px;
      background: #232323;
      border-radius: var(--radius-pill);
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: var(--radius-pill);
      width: 20%;
      transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    }

    /* Main Workspace Grid */
    .workspace-grid {
      display: grid;
      grid-template-columns: 270px 1fr;
      gap: 20px;
      align-items: start;
    }

    /* Left Step Sidebar */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: sticky;
      top: 18px;
    }
    .step-nav-btn {
      width: 100%;
      text-align: left;
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 15px 18px;
      border-radius: var(--radius-md);
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .step-nav-btn:hover {
      background: var(--bg-card);
      color: var(--text-primary);
    }
    .step-nav-btn.active {
      background: linear-gradient(90deg, rgba(255, 109, 51, 0.16) 0%, rgba(24, 24, 24, 0.95) 100%);
      border-color: var(--border-active);
      color: var(--text-primary);
      font-weight: 600;
    }
    .step-badge {
      font-size: 11px;
      padding: 2px 8px;
      border-radius: var(--radius-pill);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
    }
    .step-nav-btn.active .step-badge {
      background: var(--accent);
      color: #fff;
    }

    /* Sidebar Quick DNA Monitor */
    .dna-summary-box {
      margin-top: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 14px;
      font-size: 12.5px;
    }
    .dna-summary-title {
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .dna-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px dashed #2a2a2a;
      color: var(--text-secondary);
      gap: 8px;
    }
    .dna-row:last-child { border-bottom: none; }
    .dna-val {
      color: var(--text-primary);
      font-weight: 500;
      text-align: right;
      max-width: 155px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Right Main Panel */
    .main-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 28px 30px;
      min-height: 600px;
    }
    .panel-header {
      margin-bottom: 22px;
    }
    .panel-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .panel-subtitle {
      font-size: 14px;
      color: var(--text-secondary);
    }

    /* Buttons & Pills */
    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border: none;
      padding: 11px 20px;
      border-radius: var(--radius-md);
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }
    .btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: var(--bg-pill);
      color: var(--text-primary);
      border: 1px solid var(--border-subtle);
      padding: 9px 16px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-secondary:hover {
      background: var(--bg-pill-hover);
      border-color: #444;
    }
    .btn-secondary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-accent-outline {
      background: rgba(255, 109, 51, 0.12);
      color: #ffb293;
      border: 1px solid rgba(255, 109, 51, 0.45);
      padding: 9px 15px;
      border-radius: var(--radius-md);
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-accent-outline:hover {
      background: rgba(255, 109, 51, 0.22);
      color: #ffffff;
    }

    .section-block {
      margin-bottom: 24px;
    }
    .section-label {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .section-hint {
      font-size: 12.5px;
      font-weight: 400;
      color: var(--text-secondary);
    }

    .text-input, .textarea-input, .select-input {
      width: 100%;
      background: var(--bg-main);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
      padding: 12px 15px;
      border-radius: var(--radius-md);
      font-size: 14.5px;
      font-family: inherit;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .text-input:focus, .textarea-input:focus, .select-input:focus {
      outline: none;
      border-color: var(--accent);
    }
    .textarea-input {
      min-height: 120px;
      resize: vertical;
      line-height: 1.65;
    }

    /* Pill Grid */
    .pill-group {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }
    .pill-btn {
      background: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      color: #d8d8d8;
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      font-size: 13.5px;
      cursor: pointer;
      transition: all 0.18s ease;
      user-select: none;
    }
    .pill-btn:hover {
      background: var(--bg-pill-hover);
      border-color: #484848;
      color: #fff;
    }
    .pill-btn.active {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }

    /* Audio Upload & Waveform Studio Box */
    .audio-dropzone {
      border: 1.5px dashed #3d3d3d;
      background: linear-gradient(180deg, #151515 0%, #101010 100%);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      margin-bottom: 22px;
      transition: all 0.2s ease;
    }
    .audio-dropzone.dragover {
      border-color: var(--accent);
      background: rgba(255, 109, 51, 0.08);
    }
    .dropzone-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .waveform-wrap {
      margin-top: 14px;
      background: #0b0b0b;
      border: 1px solid #262626;
      border-radius: var(--radius-md);
      padding: 12px;
    }
    canvas#waveformCanvas {
      width: 100%;
      height: 78px;
      display: block;
      border-radius: 6px;
    }
    .acoustic-metrics-bar {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .metric-chip {
      background: #161616;
      border: 1px solid #292929;
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 12px;
    }
    .metric-chip span {
      display: block;
      color: var(--text-secondary);
      font-size: 11px;
    }
    .metric-chip strong {
      color: var(--accent);
      font-size: 13.5px;
    }
    .dual-engine-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
      align-items: center;
    }
    .api-key-inline {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      min-width: 300px;
      flex-wrap: wrap;
    }
    .api-key-inline input {
      margin-bottom: 0;
      padding: 9px 12px;
      font-size: 13px;
      font-family: var(--font-mono);
      flex: 1;
      min-width: 190px;
    }
    .api-key-inline select {
      margin-bottom: 0;
      padding: 9px 10px;
      font-size: 12.5px;
      font-family: var(--font-mono);
      width: auto;
      background: #181818;
    }
    .byok-notice {
      margin-top: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid #272727;
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .byok-notice a, .inline-link {
      color: var(--accent);
      text-decoration: underline;
      cursor: pointer;
    }

    /* 4-Genre System Selector Cards */
    .genre-cards-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .genre-card {
      background: var(--bg-main);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 13px 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .genre-card:hover {
      border-color: #4a4a4a;
      background: #171717;
    }
    .genre-card.active {
      border-color: var(--accent);
      background: linear-gradient(145deg, rgba(255, 109, 51, 0.16) 0%, #151515 100%);
      box-shadow: 0 4px 14px rgba(255, 109, 51, 0.15);
    }
    .genre-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .genre-card-title {
      font-size: 14.5px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .genre-card-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
      line-height: 1.4;
    }

    /* Two-column cards inside steps */
    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .info-card {
      background: var(--bg-main);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 16px;
    }
    .info-card h4 {
      font-size: 14px;
      color: var(--accent);
      margin-bottom: 10px;
    }

    /* Sliders */
    .slider-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }
    .slider-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-secondary);
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    /* Code / Prompt Output Box */
    .code-box {
      background: #0c0c0c;
      border: 1px solid #2c2c2c;
      border-radius: var(--radius-md);
      padding: 14px 16px;
      font-family: var(--font-mono);
      font-size: 12.5px;
      color: #e4e4e4;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 290px;
      overflow-y: auto;
      line-height: 1.55;
    }

    /* Footer Navigation */
    .panel-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid var(--border-subtle);
    }

    /* Modal for JSON & Guide */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.82);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      max-width: 860px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px 26px;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-subtle);
    }

    /* Guide Modal Tabs & Tables */
    .guide-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .guide-tab-btn {
      background: var(--bg-pill);
      border: 1px solid var(--border-subtle);
      color: var(--text-secondary);
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    .guide-tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .guide-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      margin-bottom: 14px;
    }
    .guide-table th, .guide-table td {
      border: 1px solid var(--border-subtle);
      padding: 10px 12px;
      text-align: left;
      vertical-align: top;
    }
    .guide-table th {
      background: #141414;
      color: var(--accent);
      font-weight: 600;
    }
    .guide-step-list {
      padding-left: 20px;
      font-size: 13.5px;
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--accent);
      color: #fff;
      padding: 11px 18px;
      border-radius: var(--radius-md);
      font-size: 14px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
      opacity: 0;
      pointer-events: none;
      transform: translateY(10px);
      transition: all 0.25s ease;
      z-index: 1100;
    }
    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .tag-advanced {
      font-size: 11px;
      background: rgba(255, 109, 51, 0.18);
      color: var(--accent);
      border: 1px solid rgba(255, 109, 51, 0.4);
      padding: 2px 8px;
      border-radius: var(--radius-pill);
    }

    @media (max-width: 960px) {
      .workspace-grid { grid-template-columns: 1fr; }
      .sidebar { position: static; }
      .mode-tabs { grid-template-columns: repeat(2, 1fr); }
      .genre-cards-grid { grid-template-columns: repeat(2, 1fr); }
      .acoustic-metrics-bar { grid-template-columns: repeat(2, 1fr); }
      .two-col { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Top Utility Bar -->
  <div class="utility-bar">
    <div class="brand-badge">
      <span class="brand-dot"></span>
      <span><strong>AI 跨界音樂元素工作站 v28</strong> ｜ Gemini 3.1 Pro 深度解析 × 四大曲風重混</span>
    </div>
    <div class="utility-actions">
      <button class="btn-accent-outline" onclick="openGuideModal('prompt')">📖 使用指南 / 萬用提取指令</button>
      <button class="btn-secondary" onclick="openJsonModal()">🧬 音樂元素庫 / JSON 匯入匯出</button>
      <button class="btn-secondary" onclick="toggleAudioPreview()" id="audioBtn">🔊 試聽和聲動機</button>
    </div>
  </div>

  <!-- 4 Mode Tabs -->
  <div class="mode-tabs" id="modeTabs">
    <button class="mode-tab active" data-mode="lyric_basic" onclick="setMode('lyric_basic')">含歌詞初階</button>
    <button class="mode-tab" data-mode="inst_basic" onclick="setMode('inst_basic')">純音樂初階</button>
    <button class="mode-tab" data-mode="lyric_adv" onclick="setMode('lyric_adv')">含歌詞高階</button>
    <button class="mode-tab" data-mode="inst_adv" onclick="setMode('inst_adv')">純音樂高階</button>
  </div>

  <!-- Progress Bar -->
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <!-- Main Workspace -->
  <div class="workspace-grid">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <button class="step-nav-btn active" data-step="1" onclick="goStep(1)">
        <span id="nav-label-1">1 構想與曲風元素</span>
        <span class="step-badge">起點</span>
      </button>
      <button class="step-nav-btn" data-step="2" onclick="goStep(2)">
        <span>2 曲風情緒與和聲</span>
        <span class="step-badge" id="badge-step2">調性</span>
      </button>
      <button class="step-nav-btn" data-step="3" onclick="goStep(3)">
        <span id="nav-label-3">3 人聲樂器與音場</span>
        <span class="step-badge">配器</span>
      </button>
      <button class="step-nav-btn" data-step="4" onclick="goStep(4)">
        <span id="nav-label-4">4 歌詞結構與格律</span>
        <span class="step-badge" id="badge-step4">詞曲</span>
      </button>
      <button class="step-nav-btn" data-step="5" onclick="goStep(5)">
        <span>5 輸出與 JSON 打包</span>
        <span class="step-badge">完成</span>
      </button>

      <!-- Live DNA Monitor -->
      <div class="dna-summary-box">
        <div class="dna-summary-title">
          <span>🧬 目前音樂元素快照</span>
          <span id="modeLabelTag" style="font-size:11px;color:#a0a0a0;">含歌詞初階</span>
        </div>
        <div class="dna-row"><span>音樂體系</span><span class="dna-val" id="sum-system">華語流行經典</span></div>
        <div class="dna-row"><span>元素來源</span><span class="dna-val" id="sum-source">時代抒情大歌</span></div>
        <div class="dna-row"><span>目標新歌名</span><span class="dna-val" id="sum-title">霓虹散場後</span></div>
        <div class="dna-row"><span>速度 / 拍號</span><span class="dna-val" id="sum-tempo">92 BPM · 4/4</span></div>

  // =========================================================================
  // 6. AUDIO UPLOAD, WAVEFORM RENDERING & DUAL-TRACK ANALYSIS ENGINE
  // =========================================================================
  async function handleAudioFileUpload(file) {
    if (!file) return;
    if (uploadedAudio.objectUrl) URL.revokeObjectURL(uploadedAudio.objectUrl);

    uploadedAudio.file = file;
    uploadedAudio.fileName = file.name;
    uploadedAudio.mimeType = file.type || inferAudioMimeType(file.name);
    uploadedAudio.objectUrl = URL.createObjectURL(file);
    uploadedAudio.isPlayingFile = false;
    if (fileAudioElement) {
      fileAudioElement.pause();
      fileAudioElement = null;
    }

    showToast(`🎵 正在解碼音檔波形：${file.name}...`);

    try {
      const arrayBuf = await file.arrayBuffer();
      const tempCtx = new (window.AudioContext || window.webkitAudioContext)();
      const audioBuffer = await tempCtx.decodeAudioData(arrayBuf);
      uploadedAudio.durationSec = audioBuffer.duration;

      const channelData = audioBuffer.getChannelData(0);
      const numBars = 140;
      const blockSize = Math.floor(channelData.length / numBars);
      const peaks = [];
      let sumSquares = 0;
      let zeroCrossings = 0;

      for (let i = 0; i < numBars; i++) {
        let maxVal = 0;
        const start = i * blockSize;
        for (let j = 0; j < blockSize; j++) {
          const idx = start + j;
          if (idx >= channelData.length) break;
          const v = Math.abs(channelData[idx]);
          if (v > maxVal) maxVal = v;
          sumSquares += channelData[idx] * channelData[idx];
          if (idx > 0 && ((channelData[idx - 1] >= 0 && channelData[idx] < 0) || (channelData[idx - 1] < 0 && channelData[idx] >= 0))) {
            zeroCrossings++;
          }
        }
        peaks.push(maxVal);
      }

      const rms = Math.sqrt(sumSquares / channelData.length);
      const rmsDb = Math.max(-60, 20 * Math.log10(rms || 1e-6));
      const peakDb = 20 * Math.log10(Math.max(...peaks, 1e-6));
      const crestFactorDb = Math.max(3, Math.min(24, peakDb - rmsDb));
      const zcrRate = zeroCrossings / audioBuffer.duration;

      const detectedBpm = estimateBpmFromBuffer(audioBuffer);
      const suggestedSystem = classifyGenreFromAcoustics(detectedBpm, crestFactorDb, zcrRate, file.name);

      uploadedAudio.peaks = peaks;
      uploadedAudio.metrics = {
        bpm: detectedBpm,
        dynamicRangeDb: crestFactorDb.toFixed(1),
        brightnessHz: Math.round(zcrRate * 0.5),
        suggestedSystemId: suggestedSystem.id,
        suggestedSystemName: suggestedSystem.name
      };

      await tempCtx.close();
      renderPanel();
      drawWaveformCanvas();

      if (isAdvMode() && (uploadedAudio.geminiApiKey || "").trim()) {
        showToast(`✅ 音檔上傳完成，偵測到已輸入 API Key，自動啟動「🧠 軌道 B：Gemini AI 深度解析」...`);
        await runGeminiDeepAnalysis();
      } else {
        showToast(`✅ 波形與基礎聲學提取完成（偵測約 ${detectedBpm} BPM）`);
      }
    } catch (err) {
      showToast(`⚠️ 音檔解碼失敗：${err.message}`);
    }
  }

  function inferAudioMimeType(filename) {
    const ext = filename.split(".").pop().toLowerCase();
    const map = { mp3: "audio/mp3", wav: "audio/wav", m4a: "audio/mp4", aac: "audio/aac", ogg: "audio/ogg", flac: "audio/flac" };
    return map[ext] || "audio/mp3";
  }

  function estimateBpmFromBuffer(audioBuffer) {
    const sampleRate = audioBuffer.sampleRate;
    const data = audioBuffer.getChannelData(0);
    const maxSamples = Math.min(data.length, sampleRate * 45);
    const hop = Math.floor(sampleRate / 100);
    const env = [];
    for (let i = 0; i < maxSamples; i += hop) {
      let sum = 0;
      for (let j = 0; j < hop && i + j < maxSamples; j++) {
        sum += data[i + j] * data[i + j];
      }
      env.push(Math.sqrt(sum / hop));
    }

    let bestBpm = 96;
    let bestScore = -1;
    for (let bpm = 60; bpm <= 155; bpm++) {
      const lag = Math.round((60 / bpm) * 100);
      let corr = 0;
      for (let i = 0; i < env.length - lag; i++) {
        corr += env[i] * env[i + lag];
      }
      if (corr > bestScore) {
        bestScore = corr;
        bestBpm = bpm;
      }
    }
    return bestBpm;
  }

  function classifyGenreFromAcoustics(bpm, dynamicRangeDb, zcrRate, fileName) {
    const lower = fileName.toLowerCase();
    if (/symphony|concerto|sonata|op\.|chopin|bach|mozart|beethoven|piano|violin|古典|交響|夜曲/.test(lower)) {
      return GENRE_SYSTEMS.classical;
    }
    if (/kpop|k-pop|blackpink|newjeans|bts|aespa|ive|twice|exo|韓|신기루/.test(lower)) {
      return GENRE_SYSTEMS.kpop;
    }
    if (dynamicRangeDb > 13.5 && bpm < 112) {
      return GENRE_SYSTEMS.classical;
    }
    if (bpm >= 118 && dynamicRangeDb < 10.5) {
      return GENRE_SYSTEMS.kpop;
    }
    if (bpm >= 102 && bpm < 126) {
      return GENRE_SYSTEMS.uspop;
    }
    return GENRE_SYSTEMS.mandopop;
  }

  function drawWaveformCanvas() {
    const canvas = document.getElementById("waveformCanvas");
    if (!canvas || !uploadedAudio.peaks.length) return;
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = Math.max(300, rect.width * dpr);
    canvas.height = 78 * dpr;
    const ctx = canvas.getContext("2d");
    ctx.scale(dpr, dpr);

    const w = rect.width || 600;
    const h = 78;
    ctx.clearRect(0, 0, w, h);

    const peaks = uploadedAudio.peaks;
    const barW = w / peaks.length;
    peaks.forEach((p, idx) => {
      const barH = Math.max(4, p * (h - 10));
      const x = idx * barW;
      const y = (h - barH) / 2;
      ctx.fillStyle = idx % 2 === 0 ? "#ff6d33" : "#ff9466";
      ctx.fillRect(x + 1, y, Math.max(2, barW - 2), barH);
    });
  }

  function toggleUploadedFilePlayback() {
    if (!uploadedAudio.objectUrl) return;
    if (!fileAudioElement) {
      fileAudioElement = new Audio(uploadedAudio.objectUrl);
      fileAudioElement.onended = () => {
        uploadedAudio.isPlayingFile = false;
        renderPanel();
        drawWaveformCanvas();
      };
    }
    if (uploadedAudio.isPlayingFile) {
      fileAudioElement.pause();
      uploadedAudio.isPlayingFile = false;
    } else {
      fileAudioElement.play();
      uploadedAudio.isPlayingFile = true;
    }
    renderPanel();
    drawWaveformCanvas();
  }

        if (mt.melodyContour) state.melodyContour = mt.melodyContour;
        if (Array.isArray(mt.moods)) state.moods = mt.moods;

      }

        if (ov.vocalStyle) state.vocalStyle = ov.vocalStyle;
        if (ov.vocalRange) state.vocalRange = ov.vocalRange;
        if (typeof ov.chestResonancePercent === "number") state.chestRatio = ov.chestResonancePercent;

      if (dna.structureAndLyrics) {
        const sl = dna.structureAndLyrics;
        if (sl.themeCategory) state.themeCategory = sl.themeCategory;
        if (Array.isArray(sl.keywords) && sl.keywords.length) state.selectedKeywords = sl.keywords;
        if (Array.isArray(sl.formStructure) && sl.formStructure.length) state.formStructure = sl.formStructure;
        if (sl.sectionTimeline) state.sectionTimeline = sl.sectionTimeline;
        if (sl.hookAndMotif) state.hookAndMotif = sl.hookAndMotif;
        if (sl.climaxDesign) state.climaxDesign = sl.climaxDesign;
        if (sl.lyricPattern) state.lyricPattern = sl.lyricPattern;
        if (sl.rhymeAndProsody) state.rhymeAndProsody = sl.rhymeAndProsody;
        if (sl.newStyleMatchedLyrics) state.generatedLyrics = sl.newStyleMatchedLyrics;
      }

      uploadedAudio.geminiAppliedKeywords = state.selectedKeywords.join("、");
      uploadedAudio.lastAppliedReport = [];
      rebuildAppliedReport();
      uploadedAudio.reportExpanded = true;
      uploadedAudio.isAnalyzingGemini = false;
      setMode(state.mode);
      drawWaveformCanvas();
      showToast(`🧠 ${selectedModel} 深度解析完成！已生成 28 項全方位音樂元素並同步套用至各頁`);
    } catch (err) {
      uploadedAudio.isAnalyzingGemini = false;
      renderPanel();
      drawWaveformCanvas();
      alert("Gemini API 深度解析失敗：" + err.message);
    }
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const res = String(reader.result);
        const commaIdx = res.indexOf(",");
        resolve(commaIdx >= 0 ? res.slice(commaIdx + 1) : res);
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function selectGenreSystem(sysId) {
    state.systemId = sysId;
    const sys = GENRE_SYSTEMS[sysId];
    const firstCategory = Object.keys(sys.themeCategories)[0];
    state.themeCategory = firstCategory;
    state.selectedKeywords = sys.themeCategories[firstCategory].slice(0, 3);
    state.songTitle = sys.defaultTitle;
    loadGenrePreset(sysId, false, sys.presets[0].id);
    showToast(`已切換至「${sys.name}」音樂元素體系`);
  }

  function loadGenrePreset(sysId, fromModal = false, specificPresetId = null) {
    state.systemId = sysId;
    const sys = GENRE_SYSTEMS[sysId];
    const preset = specificPresetId
      ? (sys.presets.find(p => p.id === specificPresetId) || sys.presets[0])
      : sys.presets[0];

    state.presetId = preset.id;
    state.sourceLabel = preset.label.split("（")[0];
    if (preset.eraAesthetics) state.eraAesthetics = preset.eraAesthetics;
    state.bpm = preset.bpm;
    state.timeSignature = preset.timeSignature;
    if (preset.groovePocket) state.groovePocket = preset.groovePocket;
    state.keyHarmony = preset.keyHarmony;
    if (preset.chordProgression) state.chordProgression = preset.chordProgression;
    state.harmonyTags = [...preset.harmonyTags];
    if (preset.melodyContour) state.melodyContour = preset.melodyContour;
    state.moods = [...preset.moods];
    if (preset.emotionalArc) state.emotionalArc = preset.emotionalArc;
    state.vocalStyle = preset.vocalStyle;
    state.vocalRange = preset.vocalRange;
    state.chestRatio = preset.chestRatio;
    state.reverbLevel = preset.reverbLevel;
    if (preset.vocalTechniques) state.vocalTechniques = preset.vocalTechniques;
    if (preset.vocalDiction) state.vocalDiction = preset.vocalDiction;
    if (preset.backingVocals) state.backingVocals = preset.backingVocals;
    if (preset.leadInstrument) state.leadInstrument = preset.leadInstrument;
    if (preset.playingArticulation) state.playingArticulation = preset.playingArticulation;
    if (preset.counterMelody) state.counterMelody = preset.counterMelody;
    state.instruments = [...preset.instruments];
    if (preset.bassAndPercussion) state.bassAndPercussion = preset.bassAndPercussion;
    if (preset.arrangementDensity) state.arrangementDensity = preset.arrangementDensity;
    state.mixingStyle = preset.mixingStyle;
    if (preset.stereoImaging) state.stereoImaging = preset.stereoImaging;
    if (preset.dynamicContrast) state.dynamicContrast = preset.dynamicContrast;
    state.formStructure = [...preset.formStructure];
    if (preset.sectionTimeline) state.sectionTimeline = preset.sectionTimeline;
    if (preset.hookAndMotif) state.hookAndMotif = preset.hookAndMotif;
    if (preset.climaxDesign) state.climaxDesign = preset.climaxDesign;
    state.lyricPattern = preset.lyricPattern;
    if (preset.rhymeAndProsody) state.rhymeAndProsody = preset.rhymeAndProsody;
    state.generatedLyrics = preset.sampleSeedLyrics;
    state.lyricsManuallyEdited = false;

    if (!sys.themeCategories[state.themeCategory]) {
      const firstCat = Object.keys(sys.themeCategories)[0];
      state.themeCategory = firstCat;
      state.selectedKeywords = sys.themeCategories[firstCat].slice(0, 3);
    }

    if (fromModal) {
      document.getElementById("jsonEditorArea").value = JSON.stringify(buildExportJson(), null, 2);
      showToast(`已載入 ${sys.name} 標準 JSON 範本`);
    }
    renderPanel();
    drawWaveformCanvas();
  }

  function triggerOneClickInspiration() {
    const sys = currentSystem();
    const titles = sys.titlePool;
    state.songTitle = titles[Math.floor(Math.random() * titles.length)];
    const cats = Object.keys(sys.themeCategories);
    const randomCat = cats[Math.floor(Math.random() * cats.length)];
    state.themeCategory = randomCat;
    const pool = [...sys.themeCategories[randomCat]];
    pool.sort(() => Math.random() - 0.5);
    state.selectedKeywords = pool.slice(0, 3);
    generateStyleMatchedLyrics(false);
    renderPanel();
    drawWaveformCanvas();
    showToast(`🎲 已為「${sys.name}」生成靈感與對仗新詞！`);
  }

  // =========================================================================
  // 10. STATE HELPERS & PROMPT / JSON BUILDERS
  // =========================================================================
  function toggleKeyword(word) {
    const idx = state.selectedKeywords.indexOf(word);
    if (idx >= 0) state.selectedKeywords.splice(idx, 1);
    else state.selectedKeywords.push(word);
    if (isLyricMode() && !state.lyricsManuallyEdited && !uploadedAudio.lastAppliedReport) {
      generateStyleMatchedLyrics(false);
    }
    renderPanel();
    drawWaveformCanvas();
  }

  function toggleArrayItem(key, item) {
    const arr = state[key];
    const idx = arr.indexOf(item);
    if (idx >= 0) arr.splice(idx, 1);
    else arr.push(item);
    renderPanel();
  }

  function buildSunoStylePrompt() {
    const sys = currentSystem();
    const modeTag = isLyricMode() ? "Vocal Track" : "Instrumental Only, No Vocals";
    if (!isAdvMode()) {
      return [
        sys.enName,
        `${state.bpm} BPM`,
        state.timeSignature.split("（")[0],
        state.keyHarmony,
        state.harmonyTags.length ? `Harmony: ${state.harmonyTags.join(", ")}` : "",
        state.moods.join(", "),
        isLyricMode() ? state.vocalStyle : `Lead: ${state.leadInstrument}`,
        `Instruments: ${state.instruments.join(", ")}`,
        modeTag
      ].filter(Boolean).join(" | ");
    }
    return [
      sys.enName,
      state.eraAesthetics,
      `${state.bpm} BPM`,
      state.timeSignature.split("（")[0],
      `Groove: ${state.groovePocket}`,
      state.keyHarmony,
      `Chords: ${state.chordProgression}`,
      `Melody: ${state.melodyContour}`,
      state.moods.join(", "),
      isLyricMode()
        ? `${state.vocalStyle}, ${state.vocalTechniques}, ${state.backingVocals}`
        : `Lead Solo: ${state.leadInstrument}, ${state.playingArticulation}, Counter-Melody: ${state.counterMelody}`,
      `Instruments: ${state.instruments.join(", ")}, ${state.bassAndPercussion}`,
      `Production: ${state.mixingStyle}, Reverb ${state.reverbLevel}%, ${state.stereoImaging}, ${state.dynamicContrast}`,
      modeTag
    ].filter(Boolean).join(" | ");
  }

  function buildFullDeliverableText() {
    if (!isLyricMode()) {
      if (!isAdvMode()) {
        return `[Instrumental Blueprint for "${state.songTitle}"]\n` +
          `Theme & Keywords: [${state.themeCategory}] ${state.selectedKeywords.join(", ")}\n` +
          `Style: ${buildSunoStylePrompt()}\n` +
          `----------------------------------------\n` +
          state.formStructure.map((s, i) => `[Section ${i + 1}: ${s}]\n(Instruments: ${state.instruments.join(", ")})`).join("\n\n");
      }
      return `[Instrumental Master Blueprint for "${state.songTitle}"]\n` +
        `Theme & Keywords: [${state.themeCategory}] ${state.selectedKeywords.join(", ")}\n` +
        `Style: ${buildSunoStylePrompt()}\n` +
        `Timeline: ${state.sectionTimeline}\n` +
        `Motif & Hook: ${state.hookAndMotif}\n` +
        `Climax Design: ${state.climaxDesign}\n` +
        `----------------------------------------\n` +
        state.formStructure.map((s, i) => `[Section ${i + 1}: ${s}]\n(Lead: ${state.leadInstrument} | Counter: ${state.counterMelody} | Density: ${state.arrangementDensity})`).join("\n\n");
    }
    if (!isAdvMode()) {
      return `《${state.songTitle}》\n` +
        `主題分類與靈感關鍵詞：【${state.themeCategory}】${state.selectedKeywords.join("、")}\n` +
        `Style Tags: ${buildSunoStylePrompt()}\n` +
        `----------------------------------------\n` +
        state.generatedLyrics;
    }
    return `《${state.songTitle}》\n` +
      `主題分類與靈感關鍵詞：【${state.themeCategory}】${state.selectedKeywords.join("、")}\n` +
      `Style Tags: ${buildSunoStylePrompt()}\n` +
      `Motif & Climax: ${state.hookAndMotif} ｜ ${state.climaxDesign}\n` +
      `----------------------------------------\n` +
      state.generatedLyrics;
  }

  function buildExportJson() {
    return {
      schemaVersion: "3.0-FullSpectrum-MusicElements",
      songTitle: state.songTitle,
      sourceReference: state.sourceLabel,
      eraAndAesthetics: state.eraAesthetics,
      mode: state.mode,
      genreSystem: {
        id: state.systemId,
        name: currentSystem().name,
        presetId: state.presetId
      },
      musicTheory: {
        bpm: state.bpm,
        timeSignature: state.timeSignature,
        groovePocket: state.groovePocket,
        keyAndHarmony: state.keyHarmony,
        chordProgression: state.chordProgression,
        harmonyFeatures: state.harmonyTags,
        melodyContour: state.melodyContour,
        moods: state.moods,
        emotionalArc: state.emotionalArc
      },
      orchestrationAndVocals: {
        isInstrumental: !isLyricMode(),
        vocalStyle: isLyricMode() ? state.vocalStyle : null,
        vocalRange: isLyricMode() ? state.vocalRange : null,
        chestResonancePercent: isLyricMode() ? state.chestRatio : null,
        vocalTechniques: isLyricMode() ? state.vocalTechniques : null,
        vocalDiction: isLyricMode() ? state.vocalDiction : null,
        backingVocals: isLyricMode() ? state.backingVocals : null,
        leadInstrument: state.leadInstrument,
        playingArticulation: state.playingArticulation,
        counterMelody: state.counterMelody,
        instruments: state.instruments,
        bassAndPercussion: state.bassAndPercussion,
        arrangementDensity: state.arrangementDensity,
        mixingAcoustics: state.mixingStyle,
        reverbDepthPercent: state.reverbLevel,
        stereoImaging: state.stereoImaging,
        dynamicContrast: state.dynamicContrast
      },
      structureAndLyrics: {
        themeCategory: state.themeCategory,
        keywords: state.selectedKeywords,
        formStructure: state.formStructure,
        sectionTimeline: state.sectionTimeline,
        hookAndMotif: state.hookAndMotif,
        climaxDesign: state.climaxDesign,
        lyricPattern: state.lyricPattern,
        rhymeAndProsody: state.rhymeAndProsody,
        lyrics: isLyricMode() ? state.generatedLyrics : ""
      }
    };
  }

  // =========================================================================
  // 11. JSON MODAL IMPORT / EXPORT HANDLERS
  // =========================================================================
  function openJsonModal() {
    document.getElementById("jsonEditorArea").value = JSON.stringify(buildExportJson(), null, 2);
    document.getElementById("jsonModal").classList.add("open");
  }

  function closeJsonModal() {
    document.getElementById("jsonModal").classList.remove("open");
  }

  function applyJsonFromEditor() {
    try {
      const parsed = JSON.parse(document.getElementById("jsonEditorArea").value);
      if (parsed.songTitle) state.songTitle = parsed.songTitle;
      if (parsed.suggestedNewTitle) state.songTitle = parsed.suggestedNewTitle;
      if (parsed.sourceReference) state.sourceLabel = parsed.sourceReference;
      if (parsed.sourceSongDescription) state.sourceLabel = parsed.sourceSongDescription;
      if (parsed.eraAndAesthetics) state.eraAesthetics = parsed.eraAndAesthetics;
      if (parsed.genreSystem && GENRE_SYSTEMS[parsed.genreSystem.id]) {
        state.systemId = parsed.genreSystem.id;
      }
      if (parsed.musicTheory) {
        const mt = parsed.musicTheory;
        if (mt.bpm) state.bpm = Number(mt.bpm);
        if (mt.timeSignature) state.timeSignature = mt.timeSignature;
        if (mt.groovePocket) state.groovePocket = mt.groovePocket;
        if (mt.keyAndHarmony) state.keyHarmony = mt.keyAndHarmony;
        if (mt.chordProgression) state.chordProgression = mt.chordProgression;
        if (Array.isArray(mt.harmonyFeatures)) state.harmonyTags = mt.harmonyFeatures;
        if (mt.melodyContour) state.melodyContour = mt.melodyContour;
        if (Array.isArray(mt.moods)) state.moods = mt.moods;
        if (mt.emotionalArc) state.emotionalArc = mt.emotionalArc;
      }
      if (parsed.orchestrationAndVocals) {
        const ov = parsed.orchestrationAndVocals;
        if (ov.vocalStyle) state.vocalStyle = ov.vocalStyle;
        if (ov.vocalRange) state.vocalRange = ov.vocalRange;
        if (typeof ov.chestResonancePercent === "number") state.chestRatio = ov.chestResonancePercent;
        if (ov.vocalTechniques) state.vocalTechniques = ov.vocalTechniques;
        if (ov.vocalDiction) state.vocalDiction = ov.vocalDiction;
        if (ov.backingVocals) state.backingVocals = ov.backingVocals;
        if (ov.leadInstrument) state.leadInstrument = ov.leadInstrument;
        if (ov.playingArticulation) state.playingArticulation = ov.playingArticulation;
        if (ov.counterMelody) state.counterMelody = ov.counterMelody;
        if (Array.isArray(ov.instruments)) state.instruments = ov.instruments;
        if (ov.bassAndPercussion) state.bassAndPercussion = ov.bassAndPercussion;
        if (ov.arrangementDensity) state.arrangementDensity = ov.arrangementDensity;
        if (ov.mixingAcoustics) state.mixingStyle = ov.mixingAcoustics;
        if (typeof ov.reverbDepthPercent === "number") state.reverbLevel = ov.reverbDepthPercent;
        if (ov.stereoImaging) state.stereoImaging = ov.stereoImaging;
        if (ov.dynamicContrast) state.dynamicContrast = ov.dynamicContrast;
        if (typeof ov.isInstrumental === "boolean") {
          state.mode = ov.isInstrumental ? "inst_adv" : "lyric_adv";
        }
      }
      if (parsed.structureAndLyrics) {
        const sl = parsed.structureAndLyrics;
        if (sl.themeCategory) state.themeCategory = sl.themeCategory;
        if (Array.isArray(sl.keywords)) state.selectedKeywords = sl.keywords;
        if (Array.isArray(sl.formStructure)) state.formStructure = sl.formStructure;
        if (sl.sectionTimeline) state.sectionTimeline = sl.sectionTimeline;
        if (sl.hookAndMotif) state.hookAndMotif = sl.hookAndMotif;
        if (sl.climaxDesign) state.climaxDesign = sl.climaxDesign;
        if (sl.lyricPattern) state.lyricPattern = sl.lyricPattern;
        if (sl.rhymeAndProsody) state.rhymeAndProsody = sl.rhymeAndProsody;
        if (sl.lyrics) state.generatedLyrics = sl.lyrics;
        if (sl.newStyleMatchedLyrics) state.generatedLyrics = sl.newStyleMatchedLyrics;
      }
      closeJsonModal();
      setMode(state.mode);
      drawWaveformCanvas();
      showToast("✅ 已成功解析並套用 JSON 音樂元素！");
    } catch (e) {
      alert("JSON 格式有誤，請檢查括號或引號是否完整：" + e.message);
    }
  }

  function handleJsonFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById("jsonEditorArea").value = e.target.result;
      showToast("📂 已讀取本地 JSON，請點擊「套用此 JSON 元素」");
    };
    reader.readAsText(file);
  }

  function downloadJsonFile() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(buildExportJson(), null, 2));
    const a = document.createElement("a");
    a.setAttribute("href", dataStr);
    a.setAttribute("download", `${state.songTitle || "music-dna"}-${state.systemId}.json`);
    document.body.appendChild(a);
    a.click();
    a.remove();
    showToast("⬇️ JSON 音樂元素檔已下載");
  }

  function copyText(elementId) {
    const text = document.getElementById(elementId).textContent;
    navigator.clipboard.writeText(text).then(() => showToast("📋 已複製到剪貼簿"));
  }

  // =========================================================================
  // 12. WEB AUDIO API HARMONY MOTIF SYNTHESIZER
  // =========================================================================
  let audioCtx = null;
  let isPlaying = false;
  let playTimer = null;

  function toggleAudioPreview() {
    const btn = document.getElementById("audioBtn");
    if (isPlaying) {
      isPlaying = false;
      clearTimeout(playTimer);
      btn.textContent = "🔊 試聽和聲動機";
      return;
    }
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();

    isPlaying = true;
    btn.textContent = "⏹️ 停止和聲試聽";
    playGenreProgression();
  }

  function playGenreProgression() {
    if (!isPlaying) return;
    const progressions = {
      mandopop: [
        [246.94, 311.13, 369.99, 466.16],
        [207.65, 246.94, 311.13, 369.99],
        [164.81, 207.65, 246.94, 311.13],
        [185.00, 233.08, 277.18, 329.63]
      ],
      kpop: [
        [185.00, 220.00, 277.18, 329.63],
        [196.00, 246.94, 293.66, 369.99],
        [185.00, 220.00, 277.18, 329.63],
        [138.59, 174.61, 207.65, 246.94]
      ],
      uspop: [
        [174.61, 207.65, 261.63, 311.13],
        [138.59, 174.61, 207.65, 261.63],
        [207.65, 261.63, 311.13, 392.00],
        [155.56, 196.00, 233.08, 277.18]
      ],
      classical: [
        [138.59, 164.81, 207.65, 277.18],
        [146.83, 174.61, 220.00, 277.18],
        [155.56, 207.65, 246.94, 311.13],
        [138.59, 164.81, 207.65, 277.18]
      ]
    };

    const chords = progressions[state.systemId] || progressions.mandopop;
    const beatSec = 60 / state.bpm;
    const chordDur = beatSec * 2;
    const now = audioCtx.currentTime;

    chords.forEach((chord, cIdx) => {
      chord.forEach((freq, nIdx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = state.systemId === "kpop" ? "triangle" : "sine";
        const startTime = now + cIdx * chordDur + nIdx * 0.08;
        osc.frequency.setValueAtTime(freq, startTime);

        gain.gain.setValueAtTime(0.001, startTime);
        gain.gain.exponentialRampToValueAtTime(0.06, startTime + 0.06);
        gain.gain.exponentialRampToValueAtTime(0.0008, startTime + chordDur + 0.3);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(startTime);
        osc.stop(startTime + chordDur + 0.35);
      });
    });

    playTimer = setTimeout(() => {
      if (isPlaying) playGenreProgression();
    }, chords.length * chordDur * 1000);
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
  }
  function escapeAttr(str) {
    return String(str).replace(/'/g, "\\'");
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", renderPanel);
  } else {
    renderPanel();
  }
</script>
</body>
</html>
